<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Website - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; color: #333; }
        /* INCONSISTENCY: Navbar height is 70px here */
        .navbar { height: 70px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 20px; }
        .navbar a { margin-right: 20px; text-decoration: none; color: #333; font-weight: bold; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* INCONSISTENCY: H1 size is 28px here */
        h1 { font-size: 28px; color: #111; }
        
        /* INCONSISTENCY: Button radius 12px, padding 10px 20px, color #3B82F6 */
        .btn-primary { 
            background-color: #3B82F6; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px;
            cursor: pointer;
        }
        
        /* INCONSISTENCY: Card padding 20px, radius 12px */
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
    </div>

    <div class="container">
        <h1>Dashboard Overview</h1>
        <p>This page has a button with 12px radius and a primary color of #3B82F6.</p>
        
        <div class="card">
            <h2>Recent Activity</h2>
            <p>You have new notifications.</p>
            <button class="btn-primary">View Activity</button>
        </div>
        
        <div class="card">
            <h2>Statistics</h2>
            <button class="btn-primary">Download Report</button>
        </div>
    </div>
</body>
</html>
